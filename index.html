<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мои привычки</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
   <header class="app__header">
  <div>
    <h1 class="app__title">Мои привычки</h1>
    <p class="app__date" id="date"></p>
    <p class="app__progress" id="progress">Выполнено: 0 из 21</p>
    <div class="progress-bar">
  <div class="progress-bar__fill" id="progressFill"></div>
</div>
  </div>
  <button class="app__reset" id="reset">Сбросить</button>
</header>

    <div class="tracker" id="tracker">
      <!-- Сюда JavaScript сам построит таблицу -->
    </div>
      
    <div class="add-habit">
  <button class="add-habit__btn" id="addHabitBtn">+ Добавить привычку</button>
  <div class="add-habit__form" id="addHabitForm">
    <input type="text" class="add-habit__input" id="addHabitInput" placeholder="Название привычки" maxlength="30">
    <button class="add-habit__save" id="addHabitSave">Добавить</button>
    <button class="add-habit__cancel" id="addHabitCancel">Отмена</button>
  </div>
</div>
  </main>

  <script src="script.js"></script>
</body>
</html>
